name: Check aci_edge_sandboxes
description: Format, lint, document, and test the aci_edge_sandboxes crate and its data model

inputs:
  toolchain:
    description: >-
      Rust toolchain used for formatting, linting, and tests. Defaults to the release
      that the repository's rust-toolchain.toml pins.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchains
      id: toolchains
      shell: bash
      working-directory: aci_edge_sandboxes
      env:
        REQUESTED_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        toolchain=${REQUESTED_TOOLCHAIN:-$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' ../rust-toolchain.toml)}
        msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
        test -n "${toolchain}"
        test -n "${msrv}"
        rustup toolchain install "${toolchain}" --profile minimal \
          --component clippy,rustfmt
        rustup toolchain install "${msrv}" --profile minimal
        {
          echo "toolchain=${toolchain}"
          echo "msrv=${msrv}"
        } >> "${GITHUB_OUTPUT}"

    - name: Check formatting
      shell: bash
      working-directory: aci_edge_sandboxes
      run: cargo "+${{ steps.toolchains.outputs.toolchain }}" fmt --all --check

    - name: Lint
      shell: bash
      working-directory: aci_edge_sandboxes
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        ACI_EDGE_SANDBOXES_BUNDLE: skip
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --workspace --all-targets --all-features \
          -- -D warnings
        cargo "+${{ steps.toolchains.outputs.toolchain }}" clippy --locked --workspace --lib --no-default-features \
          -- -D warnings

    - name: Test
      shell: bash
      working-directory: aci_edge_sandboxes
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        ACI_EDGE_SANDBOXES_BUNDLE: skip
      run: |
        set -euo pipefail
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --workspace --all-features
        cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --workspace

    - name: Check artifact bundling
      shell: bash
      working-directory: aci_edge_sandboxes
      run: |
        set -euo pipefail
        bundle=$(mktemp -d)
        executable=openvmm
        bundle_dir="${bundle}"
        if [[ "${RUNNER_OS}" == Windows ]]; then
          executable=openvmm.exe
          bundle_dir=$(cygpath -w "${bundle}")
        fi
        mkdir -p "${bundle}/bin" "${bundle}/guest"
        printf openvmm > "${bundle}/bin/${executable}"
        printf kernel > "${bundle}/guest/vmlinux"
        printf initramfs > "${bundle}/guest/initramfs.cpio.gz"
        cp ../SOURCE-MANIFEST.json "${bundle}/"
        (cd "${bundle}" && sha256sum "bin/${executable}" guest/vmlinux \
          guest/initramfs.cpio.gz SOURCE-MANIFEST.json > SHA256SUMS)
        ACI_EDGE_SANDBOXES_BUNDLE_DIR="${bundle_dir}" cargo "+${{ steps.toolchains.outputs.toolchain }}" test --locked --lib \
          --features bundled artifacts

    - name: Build documentation
      shell: bash
      working-directory: aci_edge_sandboxes
      env:
        ACI_EDGE_SANDBOXES_BUNDLE: skip
        RUSTDOCFLAGS: -D warnings
      run: cargo "+${{ steps.toolchains.outputs.toolchain }}" doc --locked --workspace --no-deps --all-features

    - name: Check the minimum supported Rust version
      shell: bash
      working-directory: aci_edge_sandboxes
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        ACI_EDGE_SANDBOXES_BUNDLE: skip
      run: >-
        cargo "+${{ steps.toolchains.outputs.msrv }}" check
        --locked --workspace --all-targets --all-features

    - name: Check the macOS build
      if: runner.os == 'Linux'
      shell: bash
      working-directory: aci_edge_sandboxes
      env:
        # --all-features enables `bundled`; stage nothing instead of downloading a release.
        ACI_EDGE_SANDBOXES_BUNDLE: skip
      run: |
        set -euo pipefail
        rustup target add --toolchain "${{ steps.toolchains.outputs.toolchain }}" aarch64-apple-darwin
        cargo "+${{ steps.toolchains.outputs.toolchain }}" check --locked --workspace --all-targets --all-features \
          --target aarch64-apple-darwin
