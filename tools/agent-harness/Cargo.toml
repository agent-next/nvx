[package]
name = "agent-harness"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic phase-0 scenario harness for the NVX MXC agent prototype."

[dependencies]
agent-protocol = { path = "../../agent-protocol" }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nvx-agent = { path = "../../agent", features = ["harness-supervisor"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }